<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - SBKART</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #111827;
    }

    .top {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    button,
    a {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      text-align: center;
      text-decoration: none;
      font-size: 15px;
      cursor: pointer;
    }

    .shop {
      background: #2563eb;
      color: white;
    }

    .logout {
      background: #dc2626;
      color: white;
    }

    .order {
      background: white;
      margin: 15px 0;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .order h3 {
      margin-top: 0;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin: 8px 0;
    }

    .status {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 7px;
      font-weight: bold;
    }

    .pending {
      background: #fef3c7;
      color: #92400e;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .failed {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading,
    .empty {
      text-align: center;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    .item {
      border-bottom: 1px solid #eee;
      padding: 8px 0;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>📦 My Orders</h1>

  <div class="top">
    <a class="shop" href="index.html">
      Continue Shopping
    </a>

    <button class="logout" onclick="logout()">
      Logout
    </button>
  </div>

  <div id="loading" class="loading">
    Loading orders...
  </div>

  <div id="orders"></div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  const firebaseConfig = {

    apiKey: "AIzaSyDUjtrUOtcMYtgPFjzfLwMk_c37DytwRA",

    authDomain:
      "sbkart-fa406.firebaseapp.com",

    projectId:
      "sbkart-fa406",

    storageBucket:
      "sbkart-fa406.firebasestorage.app",

    messagingSenderId:
      "890129821807",

    appId:
      "1:890129821807:web:3e1478e1f8b914ff29dd9a"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  const loading =
    document.getElementById("loading");

  const ordersBox =
    document.getElementById("orders");


  /*
    CHECK LOGIN
  */

  onAuthStateChanged(auth, async (user) => {

    if (!user) {

      window.location.href =
        "login.html";

      return;

    }

    await loadOrders(user);

  });


  /*
    LOAD ORDERS
  */

  async function loadOrders(user) {

    try {

      const snapshot =
        await getDocs(
          collection(db, "orders")
        );


      let myOrders = [];


      snapshot.forEach((doc) => {

        const data = doc.data();

        /*
          अभी पुराने orders में customerEmail नहीं है,
          इसलिए फिलहाल email से matching possible नहीं है.
        */

        if (
          data.customerEmail &&
          data.customerEmail === user.email
        ) {

          myOrders.push(data);

        }

      });


      loading.style.display =
        "none";


      if (myOrders.length === 0) {

        ordersBox.innerHTML = `
          <div class="empty">
            <h3>No orders found</h3>
            <p>
              Aapka order yahan dikhega.
            </p>
          </div>
        `;

        return;

      }


      /*
        Latest order first
      */

      myOrders.reverse();


      myOrders.forEach((order) => {

        let itemsHTML = "";


        if (Array.isArray(order.items)) {

          order.items.forEach((item) => {

            const quantity =
              Number(item.quantity) || 1;

            const price =
              Number(item.price) || 0;

            itemsHTML += `
              <div class="item">
                ${item.name || "Product"}
                × ${quantity}
                — ₹${(price * quantity).toFixed(2)}
              </div>
            `;

          });

        }


        let statusClass =
          "pending";

        if (
          order.orderStatus ===
          "Successful"
        ) {

          statusClass =
            "success";

        }

        if (
          order.orderStatus ===
          "Failed"
        ) {

          statusClass =
            "failed";

        }


        let dateText =
          "Date unavailable";


        if (order.createdAt) {

          if (
            typeof order.createdAt.toDate ===
            "function"
          ) {

            dateText =
              order.createdAt
                .toDate()
                .toLocaleString("en-IN");

          }

        }


        ordersBox.innerHTML += `

          <div class="order">

            <h3>
              Order ${order.orderId || ""}
            </h3>

            <div class="row">
              <span>Date</span>
              <span>${dateText}</span>
            </div>

            <h4>Products</h4>

            ${itemsHTML}

            <div class="row">
              <b>Product Total</b>
              <b>
                ₹${Number(order.productTotal || 0).toFixed(2)}
              </b>
            </div>

            <div class="row">
              <span>Shipping</span>
              <span>
                ₹${Number(order.shippingFee || 0).toFixed(2)}
              </span>
            </div>

            <div class="row">
              <span>Delivery</span>
              <span>
                ₹${Number(order.deliveryFee || 0).toFixed(2)}
              </span>
            </div>

            <div class="row">
              <b>Final Total</b>
              <b>
                ₹${Number(order.finalTotal || 0).toFixed(2)}
              </b>
            </div>

            <div class="row">
              <span>UTR</span>
              <span>${order.utr || "-"}</span>
            </div>

            <div class="row">
              <span>Payment</span>
              <span>
                ${order.paymentStatus || "Pending"}
              </span>
            </div>

            <div style="margin-top:12px;">
              <span class="status ${statusClass}">
                ${order.orderStatus || "Pending"}
              </span>
            </div>

          </div>

        `;

      });


    } catch (error) {

      console.error(error);

      loading.style.display =
        "none";

      ordersBox.innerHTML = `
        <div class="empty">
          <h3>Orders load nahi ho sake</h3>
          <p>
            ${error.message}
          </p>
        </div>
      `;

    }

  }


  /*
    LOGOUT
  */

  window.logout = async function() {

    await signOut(auth);

    window.location.href =
      "login.html";

  };

</script>

</body>
</html>
