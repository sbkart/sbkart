<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Orders - SBKART</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .order {
      background: white;
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-weight: bold;
    }

    .pending {
      color: #d97706;
      font-weight: bold;
    }

    .success {
      color: #15803d;
      font-weight: bold;
    }

    .failed {
      color: #dc2626;
      font-weight: bold;
    }

    .item {
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    .home {
      background: #0a8f3c;
      color: white;
    }

    .logout {
      background: #222;
      color: white;
    }

    .message {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>My Orders</h1>

  <div id="loading" class="message">
    Loading orders...
  </div>

  <div id="orders"></div>

  <div id="empty" class="message" style="display:none;">
    अभी कोई order नहीं है।
  </div>

  <button class="home" onclick="window.location.href='index.html'">
    Continue Shopping
  </button>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const const firebaseConfig = {
  apiKey: "AIzaSyDUtjrUO2tcMYtgPFjzfLwMk_c37DytwRA",
  authDomain: "sbkart-fa406.firebaseapp.com",
  projectId: "sbkart-fa406",
  storageBucket: "sbkart-fa406.firebasestorage.app",
  messagingSenderId: "890129821807",
  appId: "1:890129821807:web:3e1478e1f8b914ff29dd9a"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);


let currentUser = null;


onAuthStateChanged(auth, async (user) => {

  if (!user) {

    alert("Order History dekhne ke liye Login karein.");

    window.location.href = "login.html";

    return;
  }

  currentUser = user;

  await loadOrders();

});


async function loadOrders() {

  try {

    const snapshot =
      await getDocs(collection(db, "orders"));


    const orders = [];


    snapshot.forEach((docSnap) => {

      const data = docSnap.data();


      if (
        data.customerUid === currentUser.uid
      ) {

        orders.push(data);

      }

    });


    orders.sort((a, b) => {

      const aTime =
        a.createdAt?.seconds || 0;

      const bTime =
        b.createdAt?.seconds || 0;

      return bTime - aTime;

    });


    document.getElementById("loading").style.display =
      "none";


    if (orders.length === 0) {

      document.getElementById("empty").style.display =
        "block";

      return;
    }


    const container =
      document.getElementById("orders");


    container.innerHTML = "";


    orders.forEach((order) => {

      const div =
        document.createElement("div");

      div.className = "order";


      let itemsHTML = "";


      (order.items || []).forEach((item) => {

        const quantity =
          Number(item.quantity || 1);

        const price =
          Number(item.price || 0);

        const total =
          price * quantity;


        itemsHTML += `

          <div class="item">

            <b>${escapeHtml(item.name)}</b>

            <br>

            Quantity: ${quantity}

            ${
              item.size
              ? `<br>Size: ${escapeHtml(item.size)}`
              : ""
            }

            <br>

            ₹${total.toFixed(2)}

          </div>

        `;

      });


      const paymentStatus =
        order.paymentStatus || "Pending";

      const orderStatus =
        order.orderStatus || "Pending";


      div.innerHTML = `

        <h2>
          ${escapeHtml(order.orderId || "Order")}
        </h2>

        <div class="row">
          <span class="label">Payment Status</span>
          <span class="${getStatusClass(paymentStatus)}">
            ${escapeHtml(paymentStatus)}
          </span>
        </div>

        <div class="row">
          <span class="label">Order Status</span>
          <span class="${getStatusClass(orderStatus)}">
            ${escapeHtml(orderStatus)}
          </span>
        </div>

        <div class="row">
          <span class="label">UTR</span>
          <span>
            ${escapeHtml(order.utr || "-")}
          </span>
        </div>

        <div class="row">
          <span class="label">Total</span>
          <span>
            ₹${Number(order.finalTotal || 0).toFixed(2)}
          </span>
        </div>

        <h3>Products</h3>

        ${itemsHTML}

      `;


      container.appendChild(div);

    });


  } catch (error) {

    console.error(error);

    document.getElementById("loading").textContent =
      "Orders load nahi ho sake.";

  }

}


function getStatusClass(status) {

  if (
    status === "Successful" ||
    status === "Approved"
  ) {

    return "success";

  }

  if (
    status === "Failed" ||
    status === "Rejected"
  ) {

    return "failed";

  }

  return "pending";

}


window.logout = async function() {

  try {

    await signOut(auth);

    window.location.href = "login.html";

  } catch (error) {

    alert(error.message);

  }

};


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
