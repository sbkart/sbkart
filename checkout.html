<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout - SBKART</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
    }

    .final {
      font-size: 20px;
      font-weight: bold;
      border-top: 2px solid #222;
      margin-top: 10px;
      padding-top: 12px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .upi {
      text-align: center;
      font-weight: bold;
      word-break: break-all;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      font-size: 17px;
      cursor: pointer;
      margin-top: 8px;
    }

    .place-btn {
      background: #0a8f3c;
      color: white;
    }

    .back-btn {
      background: #222;
      color: white;
    }

    .note {
      background: #fff3cd;
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 14px;
    }

    .size {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SBKART Checkout</h1>

  <!-- CUSTOMER DETAILS -->
  <div class="box">

    <h2>Customer Details</h2>

    <label>Full Name</label>
    <input type="text" id="customerName" placeholder="Enter your name">

    <label>Mobile Number</label>
    <input type="tel" id="mobile" maxlength="10" placeholder="10 digit mobile number">

    <label>Delivery Address</label>
    <textarea id="address" placeholder="Enter complete delivery address"></textarea>

  </div>


  <!-- ORDER SUMMARY -->
  <div class="box">

    <h2>Order Summary</h2>

    <div id="orderItems"></div>

    <div class="total-row">
      <span>Product Total</span>
      <span id="productTotal">₹0</span>
    </div>

    <div class="total-row">
      <span>Shipping Fee (5%)</span>
      <span id="shippingFee">₹0</span>
    </div>

    <div class="total-row">
      <span>Delivery Fee</span>
      <span>₹50</span>
    </div>

    <div class="total-row final">
      <span>Final Total</span>
      <span id="finalTotal">₹0</span>
    </div>

  </div>


  <!-- PAYMENT -->
  <div class="box">

    <h2>Payment</h2>

    <p>नीचे दिए गए UPI ID पर payment करें:</p>

    <div class="upi">
      UPI ID: <span id="upiId">Loading...</span>
    </div>

    <div id="qrcode"></div>

    <div class="note">
      Payment करने के बाद अपना <b>12 digit UTR Number</b> नीचे डालें।
    </div>

    <label>UTR Number</label>
    <input
      type="text"
      id="utr"
      maxlength="12"
      placeholder="Enter 12 digit UTR number"
    >

    <button class="place-btn" onclick="placeOrder()">
      Submit Order
    </button>

    <button class="back-btn" onclick="window.location.href='cart.html'">
      Back to Cart
    </button>

  </div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  doc,
  getDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyDUjtrUOtcMYtgPFjzfLwMk_c37DytwRA",
  authDomain: "sbkart-fa406.firebaseapp.com",
  projectId: "sbkart-fa406",
  storageBucket: "sbkart-fa406.firebasestorage.app",
  messagingSenderId: "890129821807",
  appId: "1:890129821807:web:3e1478e1f8b914ff29dd9a"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);


let currentUser = null;

let cart = JSON.parse(localStorage.getItem("sbkartCart")) || [];

let productTotal = 0;
let shippingFee = 0;
let deliveryFee = 50;
let finalTotal = 0;

let currentUpiId = "mrsunnykumar@ptaxis";


/* LOGIN CHECK */

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    alert("Checkout ke liye pehle Login karein.");

    window.location.href = "login.html";

    return;
  }

  currentUser = user;

  if (cart.length === 0) {

    alert("Cart empty hai.");

    window.location.href = "index.html";

    return;
  }

  document.getElementById("customerName").value =
    user.displayName || "";

  await loadPaymentSettings();

  displayOrder();

});


/* PAYMENT SETTINGS */

async function loadPaymentSettings() {

  try {

    const ref = doc(db, "paymentSettings", "settings");

    const snap = await getDoc(ref);

    if (snap.exists()) {

      const data = snap.data();

      if (data.upiId) {
        currentUpiId = data.upiId;
      }

    }

  } catch (error) {

    console.log("Payment settings error:", error);

  }

  document.getElementById("upiId").textContent = currentUpiId;

  generateQR();

}


/* QR CODE */

function generateQR() {

  const qrBox = document.getElementById("qrcode");

  qrBox.innerHTML = "";

  const upiLink =
    "upi://pay?pa=" +
    encodeURIComponent(currentUpiId) +
    "&pn=" +
    encodeURIComponent("SBKART") +
    "&am=" +
    encodeURIComponent(finalTotal.toFixed(2)) +
    "&cu=INR";

  new QRCode(qrBox, {
    text: upiLink,
    width: 200,
    height: 200
  });

}


/* DISPLAY ORDER */

function displayOrder() {

  const container = document.getElementById("orderItems");

  container.innerHTML = "";

  productTotal = 0;

  cart.forEach(item => {

    const quantity = Number(item.quantity || 1);

    const price = Number(item.price || 0);

    const itemTotal = price * quantity;

    productTotal += itemTotal;


    const div = document.createElement("div");

    div.className = "item";

    div.innerHTML = `
      <div>
        <b>${escapeHtml(item.name)}</b>
        <br>
        Quantity: ${quantity}
        ${
          item.size
          ? `<br><span class="size">Size: ${escapeHtml(item.size)}</span>`
          : ""
        }
      </div>

      <div>
        ₹${itemTotal.toFixed(2)}
      </div>
    `;

    container.appendChild(div);

  });


  shippingFee = Math.round(productTotal * 0.05);

  finalTotal =
    productTotal +
    shippingFee +
    deliveryFee;


  document.getElementById("productTotal").textContent =
    "₹" + productTotal.toFixed(2);

  document.getElementById("shippingFee").textContent =
    "₹" + shippingFee.toFixed(2);

  document.getElementById("finalTotal").textContent =
    "₹" + finalTotal.toFixed(2);


  generateQR();

}


/* PLACE ORDER */

window.placeOrder = async function() {

  if (!currentUser) {

    alert("Please login first.");

    window.location.href = "login.html";

    return;
  }


  const name =
    document.getElementById("customerName").value.trim();

  const mobile =
    document.getElementById("mobile").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const utr =
    document.getElementById("utr").value.trim();


  if (!name) {

    alert("Please enter your name.");

    return;
  }


  if (!/^[0-9]{10}$/.test(mobile)) {

    alert("Please enter a valid 10 digit mobile number.");

    return;
  }


  if (!address) {

    alert("Please enter delivery address.");

    return;
  }


  if (!/^[0-9]{12}$/.test(utr)) {

    alert("Please enter a valid 12 digit UTR number.");

    return;
  }


  const orderId =
    "SBK-" +
    Date.now().toString().slice(-8);


  const orderData = {

    orderId: orderId,

    customerEmail: currentUser.email,

    customerUid: currentUser.uid,

    customerName: name,

    mobile: mobile,

    address: address,

    utr: utr,

    upiId: currentUpiId,

    items: cart,

    productTotal: productTotal,

    shippingFee: shippingFee,

    deliveryFee: deliveryFee,

    finalTotal: finalTotal,

    paymentStatus: "Pending",

    orderStatus: "Pending",

    createdAt: serverTimestamp()

  };


  try {

    await addDoc(
      collection(db, "orders"),
      orderData
    );


    localStorage.removeItem("sbkartCart");


    alert(
      "Order successfully submit ho gaya!\nOrder ID: " +
      orderId
    );


    window.location.href =
      "order-status.html?order=" +
      encodeURIComponent(orderId);


  } catch (error) {

    console.error(error);

    alert(
      "Order submit nahi ho saka.\n\n" +
      error.message
    );

  }

};


/* SECURITY / HTML ESCAPE */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
  </html>
