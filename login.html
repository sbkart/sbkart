<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBKART - Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .box {
      width: 90%;
      max-width: 400px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
      background: #111;
      color: white;
      font-size: 16px;
    }

    .link {
      text-align: center;
      margin-top: 15px;
    }

    .link a {
      color: #1976d2;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>SBKART Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button id="loginBtn">
    Login
  </button>

  <button id="forgotBtn">
    Forgot Password
  </button>

  <div class="link">
    Account nahi hai?
    <a href="register.html">Create Account</a>
  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    initializeAuth,
    browserLocalPersistence,
    setPersistence,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDUjtrUO2tcMYtgPFjzfLwMk_c37DytwRA",
    authDomain: "sbkart-fa406.firebaseapp.com",
    projectId: "sbkart-fa406",
    storageBucket: "sbkart-fa406.firebasestorage.app",
    messagingSenderId: "890129821807",
    appId: "1:890129821807:web:3e1478e1f8b914ff29dd9a"
  };


  const app = initializeApp(firebaseConfig);

  const auth = initializeAuth(app, {
    persistence: browserLocalPersistence
  });


  const loginBtn =
    document.getElementById("loginBtn");

  const forgotBtn =
    document.getElementById("forgotBtn");


  loginBtn.addEventListener("click", async () => {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if (!email || !password) {

      alert("Email aur password enter karein.");

      return;

    }


    try {

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";


      await setPersistence(
        auth,
        browserLocalPersistence
      );


      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      /*
        Firebase login successful.
        Local persistence ke saath session save ho chuka hai.
      */

      window.location.href = "index.html";


    } catch (error) {

      console.error(error);

      if (error.code === "auth/invalid-credential") {

        alert("Email ya password galat hai.");

      } else if (error.code === "auth/user-not-found") {

        alert("Account nahi mila. Pehle Create Account karein.");

      } else if (error.code === "auth/wrong-password") {

        alert("Password galat hai.");

      } else if (error.code === "auth/invalid-email") {

        alert("Email address sahi nahi hai.");

      } else {

        alert("Login failed: " + error.message);

      }

    } finally {

      loginBtn.disabled = false;
      loginBtn.textContent = "Login";

    }

  });


  forgotBtn.addEventListener("click", async () => {

    const email =
      document.getElementById("email").value.trim();


    if (!email) {

      alert("Pehle email enter karein.");

      return;

    }


    try {

      await sendPasswordResetEmail(
        auth,
        email
      );

      alert(
        "Password reset email bhej diya gaya hai."
      );

    } catch (error) {

      alert(
        "Password reset failed: " +
        error.message
      );

    }

  });

</script>

</body>
</html>
