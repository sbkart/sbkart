<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - SBKART</title>


  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    .box {
      max-width: 400px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #111827;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-btn {
      background: #16a34a;
      color: white;
    }

    .create-btn {
      background: #2563eb;
      color: white;
    }

    .reset-btn {
      background: #f59e0b;
      color: white;
    }

    .link {
      text-align: center;
      margin-top: 15px;
    }

    .link a {
      color: #2563eb;
      text-decoration: none;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    #resetBox {
      display: none;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }

    .home {
      text-align: center;
      margin-top: 20px;
    }

    .home a {
      color: #111827;
      text-decoration: none;
    }

  </style>

</head>


<body>


  <div class="box">


    <h2>🛍️ SBKART Login</h2>


    <input
      type="email"
      id="email"
      placeholder="Email Address"
    >


    <input
      type="password"
      id="password"
      placeholder="Password"
    >


    <button
      type="button"
      class="login-btn"
      id="loginBtn"
      onclick="loginUser()"
    >
      Login
    </button>


    <button
      type="button"
      class="create-btn"
      onclick="window.location.href='register.html'"
    >
      Create New Account
    </button>


    <div class="link">

      <a
        href="#"
        onclick="showReset(); return false;"
      >
        Forgot Password?
      </a>

    </div>


    <div id="resetBox">

      <input
        type="email"
        id="resetEmail"
        placeholder="Enter your email"
      >


      <button
        type="button"
        class="reset-btn"
        onclick="resetPassword()"
      >
        Send Reset Link
      </button>

    </div>


    <div id="message"></div>


    <div class="home">

      <a href="index.html">
        ← Continue Shopping
      </a>

    </div>


  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyDUjtrUOtcMYtgPFjzfLwMk_c37DytwRA",

      authDomain:
        "sbkart-fa406.firebaseapp.com",

      projectId:
        "sbkart-fa406",

      storageBucket:
        "sbkart-fa406.firebasestorage.app",

      messagingSenderId:
        "890129821807",

      appId:
        "1:890129821807:web:3e1478e1f8b914ff29dd9a"

    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    window.loginUser =
      async function() {


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const message =
        document.getElementById("message");


      const button =
        document.getElementById("loginBtn");


      message.style.color =
        "#dc2626";


      if (!email || !password) {

        message.textContent =
          "Please enter email and password.";

        return;
      }


      button.disabled = true;

      button.textContent =
        "Logging in...";


      try {


        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        message.style.color =
          "#16a34a";


        message.textContent =
          "Login successful!";


        /*
          Login ke baad customer
          seedha cart par jayega.
        */

        setTimeout(
          function() {

            window.location.href =
              "cart.html";

          },
          700
        );


      } catch (error) {


        button.disabled = false;

        button.textContent =
          "Login";


        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message.textContent =
            "Email or password is incorrect.";

        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          message.textContent =
            "Please enter a valid email address.";

        }

        else {

          message.textContent =
            error.message;

        }

      }

    };


    window.showReset =
      function() {

        document
          .getElementById("resetBox")
          .style.display = "block";

        document
          .getElementById("message")
          .textContent = "";

      };


    window.resetPassword =
      async function() {


      const email =
        document
          .getElementById("resetEmail")
          .value
          .trim();


      const message =
        document.getElementById("message");


      if (!email) {

        message.style.color =
          "#dc2626";

        message.textContent =
          "Please enter your email.";

        return;
      }


      try {


        await sendPasswordResetEmail(
          auth,
          email
        );


        message.style.color =
          "#16a34a";

        message.textContent =
          "Password reset link has been sent to your email.";


      } catch (error) {


        message.style.color =
          "#dc2626";

        message.textContent =
          error.message;

      }

    };

  </script>


</body>

</html>
