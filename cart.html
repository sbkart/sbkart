<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cart - SBKART</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    .cart-item {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      display: flex;
      gap: 15px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .cart-item img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
    }

    .details {
      flex: 1;
    }

    .details h3 {
      margin: 0 0 8px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .size {
      color: #555;
      margin-bottom: 8px;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .quantity-box button {
      width: 35px;
      height: 35px;
      padding: 0;
      font-size: 20px;
      border: none;
      border-radius: 5px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    .quantity {
      font-weight: bold;
    }

    .remove {
      margin-top: 8px;
      background: #dc2626;
      color: white;
      border: none;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .summary {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
    }

    .final {
      border-top: 2px solid #222;
      margin-top: 8px;
      padding-top: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .checkout {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      background: #0a8f3c;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 17px;
      cursor: pointer;
    }

    .continue {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #222;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 17px;
      cursor: pointer;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛒 My Cart</h1>

  <div id="cartContainer"></div>

  <div id="summary" class="summary" style="display:none;">

    <div class="summary-row">
      <span>Product Total</span>
      <span id="productTotal">₹0</span>
    </div>

    <div class="summary-row">
      <span>Shipping Fee (5%)</span>
      <span id="shippingFee">₹0</span>
    </div>

    <div class="summary-row">
      <span>Delivery Fee</span>
      <span>₹50</span>
    </div>

    <div class="summary-row final">
      <span>Final Total</span>
      <span id="finalTotal">₹0</span>
    </div>

    <button
      class="checkout"
      onclick="goToCheckout()"
    >
      Proceed to Checkout
    </button>

    <button
      class="continue"
      onclick="window.location.href='index.html'"
    >
      Continue Shopping
    </button>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {

  apiKey: "AIzaSyDUjtrUO2tcMYtgPFjzfLwMk_c37DytwRA",

  authDomain: "sbkart-fa406.firebaseapp.com",

  projectId: "sbkart-fa406",

  storageBucket: "sbkart-fa406.firebasestorage.app",

  messagingSenderId: "890129821807",

  appId: "1:890129821807:web:3e1478e1f8b914ff29dd9a"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


let currentUser = null;

let cart =
  JSON.parse(
    localStorage.getItem("sbkartCart")
  ) || [];


/* LOGIN CHECK */

onAuthStateChanged(auth, (user) => {

  if (!user) {

    alert(
      "Cart use karne ke liye pehle Create Account aur Login karein."
    );

    window.location.href =
      "register.html";

    return;
  }

  currentUser = user;

  displayCart();

});


/* DISPLAY CART */

function displayCart() {

  const container =
    document.getElementById("cartContainer");

  container.innerHTML = "";


  if (cart.length === 0) {

    container.innerHTML = `
      <div class="empty">

        <h2>Cart Empty Hai 🛒</h2>

        <p>
          Abhi cart mein koi product nahi hai.
        </p>

        <button
          class="continue"
          onclick="window.location.href='index.html'"
        >
          Shopping Start Karein
        </button>

      </div>
    `;

    document.getElementById("summary").style.display =
      "none";

    return;
  }


  cart.forEach((item, index) => {

    const quantity =
      Number(item.quantity || 1);

    const price =
      Number(item.price || 0);


    const div =
      document.createElement("div");

    div.className =
      "cart-item";


    div.innerHTML = `

      <img
        src="${escapeHtml(item.image)}"
        alt="${escapeHtml(item.name)}"
        onerror="this.style.display='none'"
      >

      <div class="details">

        <h3>
          ${escapeHtml(item.name)}
        </h3>

        <div class="price">
          ₹${price.toFixed(2)}
        </div>

        ${
          item.size
          ? `
            <div class="size">
              Size: ${escapeHtml(item.size)}
            </div>
          `
          : ""
        }

        <div class="quantity-box">

          <button
            onclick="decreaseQuantity(${index})"
          >
            −
          </button>

          <span class="quantity">
            ${quantity}
          </span>

          <button
            onclick="increaseQuantity(${index})"
          >
            +
          </button>

        </div>

        <button
          class="remove"
          onclick="removeItem(${index})"
        >
          Remove
        </button>

      </div>

    `;


    container.appendChild(div);

  });


  updateSummary();

}


/* INCREASE */

window.increaseQuantity = function(index) {

  cart[index].quantity =
    Number(cart[index].quantity || 1) + 1;

  saveCart();

};


/* DECREASE */

window.decreaseQuantity = function(index) {

  const quantity =
    Number(cart[index].quantity || 1);


  if (quantity > 1) {

    cart[index].quantity =
      quantity - 1;

  } else {

    cart.splice(index, 1);

  }


  saveCart();

};


/* REMOVE */

window.removeItem = function(index) {

  cart.splice(index, 1);

  saveCart();

};


/* SAVE CART */

function saveCart() {

  localStorage.setItem(
    "sbkartCart",
    JSON.stringify(cart)
  );

  displayCart();

}


/* SUMMARY */

function updateSummary() {

  let productTotal = 0;


  cart.forEach(item => {

    const quantity =
      Number(item.quantity || 1);

    const price =
      Number(item.price || 0);

    productTotal +=
      price * quantity;

  });


  const shippingFee =
    Math.round(productTotal * 0.05);

  const deliveryFee =
    50;

  const finalTotal =
    productTotal +
    shippingFee +
    deliveryFee;


  document.getElementById("productTotal").textContent =
    "₹" + productTotal.toFixed(2);

  document.getElementById("shippingFee").textContent =
    "₹" + shippingFee.toFixed(2);

  document.getElementById("finalTotal").textContent =
    "₹" + finalTotal.toFixed(2);


  document.getElementById("summary").style.display =
    "block";

}


/* CHECKOUT */

window.goToCheckout = function() {

  if (!currentUser) {

    alert(
      "Checkout ke liye pehle Create Account aur Login karein."
    );

    window.location.href =
      "register.html";

    return;
  }


  if (cart.length === 0) {

    alert("Cart empty hai.");

    return;
  }


  window.location.href =
    "checkout.html";

};


/* ESCAPE HTML */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
