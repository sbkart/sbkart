<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SBKART - Cart</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .cart-container {
      max-width: 700px;
      margin: 20px auto;
      padding: 15px;
    }

    .cart-item {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .cart-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
    }

    .cart-info {
      flex: 1;
    }

    .cart-info h3 {
      margin: 0 0 8px;
    }

    .price {
      color: #16a34a;
      font-weight: bold;
    }

    .qty {
      margin-top: 10px;
    }

    .qty button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 5px;
      background: #e5e7eb;
      font-size: 18px;
      cursor: pointer;
    }

    .qty span {
      margin: 0 10px;
      font-weight: bold;
    }

    .remove {
      margin-top: 10px;
      background: #dc2626;
      color: white;
      border: none;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .summary {
      background: white;
      padding: 18px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .summary h2 {
      margin-top: 0;
    }

    .summary p {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
    }

    .final-total {
      font-size: 21px;
      color: #16a34a;
    }

    .checkout {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 7px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #2563eb;
      text-decoration: none;
    }

    .empty {
      background: white;
      padding: 25px;
      text-align: center;
      border-radius: 10px;
    }

    @media (max-width: 500px) {

      .cart-item {
        align-items: flex-start;
      }

      .cart-item img {
        width: 80px;
        height: 80px;
      }

    }

  </style>

</head>

<body>

<header>
  <h1>🛒 SBKART Cart</h1>
</header>


<div class="cart-container">

  <div id="cartItems"></div>


  <div class="summary">

    <h2>Order Summary</h2>

    <p>
      <span>Total Items:</span>
      <b><span id="totalItems">0</span></b>
    </p>

    <p>
      <span>Product Total:</span>
      <b>₹<span id="cartTotal">0.00</span></b>
    </p>

    <p>
      <span>Shipping Fee (5%):</span>
      <b>₹<span id="shippingFee">0.00</span></b>
    </p>

    <p>
      <span>Delivery Fee:</span>
      <b>₹<span id="deliveryFee">50.00</span></b>
    </p>

    <hr>

    <p class="final-total">
      <span>Final Total:</span>
      <b>₹<span id="finalTotal">0.00</span></b>
    </p>

    <button class="checkout" onclick="goToCheckout()">
      Proceed to Checkout
    </button>

  </div>


  <a class="back" href="index.html">
    ← Continue Shopping
  </a>

</div>


<script>

  let cart =
    JSON.parse(localStorage.getItem("sbkartCart")) || [];


  function renderCart() {

    const cartItems =
      document.getElementById("cartItems");

    const cartTotal =
      document.getElementById("cartTotal");

    const totalItems =
      document.getElementById("totalItems");

    const shippingFee =
      document.getElementById("shippingFee");

    const deliveryFee =
      document.getElementById("deliveryFee");

    const finalTotal =
      document.getElementById("finalTotal");


    cartItems.innerHTML = "";


    let productTotal = 0;

    let itemsCount = 0;


    if (cart.length === 0) {

      cartItems.innerHTML = `
        <div class="empty">

          <h2>Your Cart is Empty</h2>

          <p>Add some products to your cart.</p>

        </div>
      `;

      document.querySelector(".summary").style.display = "none";

      return;
    }


    document.querySelector(".summary").style.display = "block";


    cart.forEach((item, index) => {

      const quantity =
        item.quantity || 1;


      const itemTotal =
        Number(item.price) * quantity;


      productTotal += itemTotal;

      itemsCount += quantity;


      cartItems.innerHTML += `

        <div class="cart-item">

          <img
            src="${item.image}"
            alt="${item.name}"
          >


          <div class="cart-info">

            <h3>${item.name}</h3>


            <div class="price">
              ₹${Number(item.price).toFixed(2)} each
            </div>


            <div class="qty">

              <button
                onclick="changeQty(${index}, -1)"
              >
                −
              </button>


              <span>
                ${quantity}
              </span>


              <button
                onclick="changeQty(${index}, 1)"
              >
                +
              </button>

            </div>


            <p>
              Item Total:
              <b>₹${itemTotal.toFixed(2)}</b>
            </p>


            <button
              class="remove"
              onclick="removeItem(${index})"
            >
              Remove
            </button>

          </div>

        </div>

      `;

    });


    // Shipping fee = 5% of Product Total

    const shipping =
      productTotal * 0.05;


    // Fixed delivery fee

    const delivery = 50;


    // Final amount

    const final =
      productTotal + shipping + delivery;


    totalItems.textContent =
      itemsCount;


    cartTotal.textContent =
      productTotal.toFixed(2);


    shippingFee.textContent =
      shipping.toFixed(2);


    deliveryFee.textContent =
      delivery.toFixed(2);


    finalTotal.textContent =
      final.toFixed(2);

  }



  function changeQty(index, change) {

    cart[index].quantity =
      (cart[index].quantity || 1) + change;


    if (cart[index].quantity < 1) {

      cart[index].quantity = 1;

    }


    localStorage.setItem(
      "sbkartCart",
      JSON.stringify(cart)
    );


    renderCart();

  }



  function removeItem(index) {

    cart.splice(index, 1);


    localStorage.setItem(
      "sbkartCart",
      JSON.stringify(cart)
    );


    renderCart();

  }



  function goToCheckout() {

    if (cart.length === 0) {

      alert("Your cart is empty.");

      return;

    }


    window.location.href =
      "checkout.html";

  }



  renderCart();

</script>

</body>
</html>
