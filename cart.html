<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Cart - SBKART</title>


  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }


    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }


    header h1 {
      margin: 0;
      font-size: 24px;
    }


    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 15px;
    }


    .cart-item {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      display: flex;
      gap: 15px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }


    .cart-item img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
    }


    .item-info {
      flex: 1;
    }


    .item-info h3 {
      margin: 0 0 8px;
    }


    .price {
      font-weight: bold;
      color: #16a34a;
      margin-bottom: 8px;
    }


    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }


    .quantity button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 5px;
      background: #e5e7eb;
      font-size: 18px;
      cursor: pointer;
    }


    .quantity span {
      min-width: 25px;
      text-align: center;
      font-weight: bold;
    }


    .remove-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
    }


    .summary {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }


    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
    }


    .final-row {
      font-size: 20px;
      font-weight: bold;
      border-top: 1px solid #ddd;
      padding-top: 15px;
    }


    .checkout-btn {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 8px;
      font-size: 17px;
      margin-top: 15px;
      cursor: pointer;
    }


    .continue {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #2563eb;
      text-decoration: none;
    }


    .empty {
      background: white;
      padding: 40px 20px;
      text-align: center;
      border-radius: 10px;
    }


    @media (max-width: 600px) {

      .cart-item {
        align-items: flex-start;
      }

      .cart-item img {
        width: 75px;
        height: 75px;
      }

      .item-info h3 {
        font-size: 16px;
      }

    }

  </style>

</head>


<body>


  <header>

    <h1>🛒 SBKART Cart</h1>

  </header>


  <div class="container">


    <div id="cartItems"></div>


    <div
      class="summary"
      id="summary"
      style="display:none;"
    >

      <h2>Order Summary</h2>


      <div class="summary-row">

        <span>Product Total</span>

        <span>
          ₹<span id="productTotal">0</span>
        </span>

      </div>


      <div class="summary-row">

        <span>Shipping Fee (5%)</span>

        <span>
          ₹<span id="shippingFee">0</span>
        </span>

      </div>


      <div class="summary-row">

        <span>Delivery Fee</span>

        <span>
          ₹<span id="deliveryFee">50</span>
        </span>

      </div>


      <div class="summary-row final-row">

        <span>Final Total</span>

        <span>
          ₹<span id="finalTotal">0</span>
        </span>

      </div>


      <button
        class="checkout-btn"
        onclick="goToCheckout()"
      >
        Proceed to Checkout
      </button>


    </div>


    <a
      href="index.html"
      class="continue"
    >
      ← Continue Shopping
    </a>


  </div>


  <script>

    let cart =
      JSON.parse(
        localStorage.getItem("sbkartCart")
      ) || [];


    const cartItems =
      document.getElementById("cartItems");

    const summary =
      document.getElementById("summary");

    const productTotalElement =
      document.getElementById("productTotal");

    const shippingElement =
      document.getElementById("shippingFee");

    const deliveryElement =
      document.getElementById("deliveryFee");

    const finalElement =
      document.getElementById("finalTotal");


    function renderCart() {

      cartItems.innerHTML = "";


      if (cart.length === 0) {

        summary.style.display = "none";


        cartItems.innerHTML = `

          <div class="empty">

            <h2>🛒 Your Cart is Empty</h2>

            <p>
              Add some products to your cart.
            </p>

            <a
              href="index.html"
              style="
                color:#2563eb;
                text-decoration:none;
              "
            >
              Go Shopping
            </a>

          </div>

        `;

        return;
      }


      summary.style.display = "block";


      let productTotal = 0;


      cart.forEach((item, index) => {

        const quantity =
          Number(item.quantity || 1);

        const price =
          Number(item.price || 0);

        const itemTotal =
          price * quantity;


        productTotal += itemTotal;


        cartItems.innerHTML += `

          <div class="cart-item">


            <img
              src="${item.image || ''}"
              alt="${item.name || 'Product'}"
            >


            <div class="item-info">

              <h3>
                ${item.name || 'Product'}
              </h3>


              <div class="price">

                ₹${price}

              </div>


              <div class="quantity">

                <button
                  onclick="decreaseQuantity(${index})"
                >
                  −
                </button>


                <span>
                  ${quantity}
                </span>


                <button
                  onclick="increaseQuantity(${index})"
                >
                  +
                </button>

              </div>


              <p>
                Item Total:
                <b>₹${itemTotal.toFixed(2)}</b>
              </p>


              <button
                class="remove-btn"
                onclick="removeItem(${index})"
              >
                Remove
              </button>

            </div>


          </div>

        `;

      });


      const shipping =
        productTotal * 0.05;


      const delivery = 50;


      const final =
        productTotal +
        shipping +
        delivery;


      productTotalElement.textContent =
        productTotal.toFixed(2);


      shippingElement.textContent =
        shipping.toFixed(2);


      deliveryElement.textContent =
        delivery.toFixed(2);


      finalElement.textContent =
        final.toFixed(2);

    }


    function increaseQuantity(index) {

      cart[index].quantity =
        Number(cart[index].quantity || 1) + 1;


      saveCart();

    }


    function decreaseQuantity(index) {

      const quantity =
        Number(cart[index].quantity || 1);


      if (quantity > 1) {

        cart[index].quantity =
          quantity - 1;

      } else {

        cart.splice(index, 1);

      }


      saveCart();

    }


    function removeItem(index) {

      cart.splice(index, 1);

      saveCart();

    }


    function saveCart() {

      localStorage.setItem(
        "sbkartCart",
        JSON.stringify(cart)
      );

      renderCart();

    }


    function goToCheckout() {

      if (cart.length === 0) {

        alert("Your cart is empty.");

        return;
      }


      window.location.href =
        "checkout.html";

    }


    renderCart();

  </script>


</body>

</html>
