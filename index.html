<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SBKART - Online Shopping</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.search {
  width: 50%;
  padding: 12px;
  border: none;
  border-radius: 8px;
}

.banner {
  background: #2563eb;
  color: white;
  margin: 15px;
  padding: 25px 15px;
  border-radius: 12px;
  text-align: center;
}

.categories,
.products {
  padding: 15px;
}

.categories h2,
.products h2 {
  margin-bottom: 12px;
}

.category-list {
  display: flex;
  gap: 10px;
  overflow-x: auto;
}

.category {
  background: white;
  padding: 12px 18px;
  border-radius: 20px;
  white-space: nowrap;
  border: 1px solid #ddd;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.product {
  background: white;
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 2px 6px #ddd;
}

.product-img {
  height: 130px;
  background: #eee;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
}

.product h3 {
  margin: 10px 0 5px;
  font-size: 16px;
}

.price {
  font-size: 18px;
  font-weight: bold;
  margin: 7px 0;
}

button {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 7px;
  background: #16a34a;
  color: white;
  font-weight: bold;
}

footer {
  margin-top: 25px;
  background: #111827;
  color: white;
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">🛍️ SBKART</div>

    <input
      class="search"
      type="text"
      placeholder="Search products..."
    >
  </div>
</header>

<div class="banner">
  <h1>Welcome to SBKART</h1>
  <p>All Products • Only UPI Payment</p>
</div>

<section class="categories">
  <h2>Categories</h2>

  <div class="category-list">
    <div class="category">👕 Fashion</div>
    <div class="category">📱 Electronics</div>
    <div class="category">🏠 Home</div>
    <div class="category">🎧 Accessories</div>
  </div>
</section>

<section class="products">
  <h2>Popular Products</h2>

  <div class="product-grid" id="productGrid">
  </div>
</section>

<footer>
  © 2026 SBKART
</footer>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDUtjrUO2tcMYtgPFjzfLwMk_c37DytwRA",
    authDomain: "sbkart-fa406.firebaseapp.com",
    projectId: "sbkart-fa406",
    storageBucket: "sbkart-fa406.firebasestorage.app",
    messagingSenderId: "890129821807",
    appId: "1:890129821807:web:3e1478e1f8b914ff29dd9a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const productGrid = document.getElementById("productGrid");

  async function loadProducts() {
    const snapshot = await getDocs(collection(db, "products"));

    snapshot.forEach((doc) => {
      const product = doc.data();

      productGrid.innerHTML += `
        <div class="product">
          <div class="product-img">🛍️</div>
          <h3>${product.name}</h3>
          <div class="price">₹${product.price || 0}</div>
          <button>Buy Now</button>
        </div>
      `;
    });
  }

  loadProducts();
        </script>
</body>
</html>
