<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBKART - Online Shopping</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 9px 13px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn {
      background: white;
      color: #111;
    }

    .logout {
      background: #e53935;
      color: white;
    }

    .orders {
      background: #1976d2;
      color: white;
    }

    .cart {
      background: #ff9800;
      color: white;
    }

    #userBox {
      display: none;
      font-size: 14px;
      margin-right: 5px;
    }

    .categories {
      max-width: 1100px;
      margin: 15px auto;
      padding: 0 10px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .category {
      background: white;
      border: 1px solid #ddd;
      white-space: nowrap;
    }

    .category.active {
      background: #111;
      color: white;
    }

    .products {
      max-width: 1100px;
      margin: auto;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 12px;
    }

    .product h3 {
      margin: 0 0 7px;
      font-size: 17px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      font-size: 13px;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 9px;
      margin-bottom: 9px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: white;
    }

    .add {
      width: 100%;
      background: #111;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
      grid-column: 1 / -1;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #666;
      grid-column: 1 / -1;
    }
  </style>
</head>

<body>

<header>
  <div class="top">

    <div class="logo">SBKART</div>

    <div class="buttons">

      <div id="userBox">
        Welcome, <span id="userName"></span>
      </div>

      <button id="registerBtn"
              class="btn"
              onclick="location.href='register.html'">
        Create Account
      </button>

      <button id="loginBtn"
              class="btn"
              onclick="location.href='login.html'">
        Login
      </button>

      <button id="ordersBtn"
              class="orders"
              style="display:none"
              onclick="openOrders()">
        Order History
      </button>

      <button id="cartBtn"
              class="cart"
              onclick="openCart()">
        Cart (<span id="cartCount">0</span>)
      </button>

      <button id="logoutBtn"
              class="logout"
              style="display:none"
              onclick="logoutUser()">
        Logout
      </button>

    </div>
  </div>
</header>

<div class="categories" id="categories">
  <button class="category active" onclick="selectCategory('All', this)">
    All
  </button>

  <button class="category" onclick="selectCategory(\"Men's Clothing\", this)">
    Men's Clothing
  </button>

  <button class="category" onclick="selectCategory(\"Women's Clothing\", this)">
    Women's Clothing
  </button>

  <button class="category" onclick="selectCategory(\"Kids' Clothing\", this)">
    Kids' Clothing
  </button>

  <button class="category" onclick="selectCategory('Footwear', this)">
    Footwear
  </button>

  <button class="category" onclick="selectCategory('Electronics', this)">
    Electronics
  </button>

  <button class="category" onclick="selectCategory('Home & Kitchen', this)">
    Home & Kitchen
  </button>
</div>

<div id="products" class="products">
  <div class="loading">Products loading...</div>
</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    initializeAuth,
    browserLocalPersistence,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  /* =========================
     FIREBASE CONFIG
  ========================== */

  const firebaseConfig = {
    apiKey: "AIzaSyDUjtrUO2tcMYtgPFjzfLwMk_c37DytwRA",
    authDomain: "sbkart-fa406.firebaseapp.com",
    projectId: "sbkart-fa406",
    storageBucket: "sbkart-fa406.firebasestorage.app",
    messagingSenderId: "890129821807",
    appId: "1:890129821807:web:3e1478e1f8b914ff29dd9a"
  };


  /* =========================
     FIREBASE START
  ========================== */

  const app = initializeApp(firebaseConfig);

  const auth = initializeAuth(app, {
    persistence: browserLocalPersistence
  });

  const db = getFirestore(app);


  /* =========================
     VARIABLES
  ========================== */

  let currentUser = null;
  let allProducts = [];
  let selectedCategory = "All";


  /* =========================
     AUTH STATE
  ========================== */

  onAuthStateChanged(auth, (user) => {

    currentUser = user;

    updateUserInterface();

  });


  /* =========================
     USER INTERFACE
  ========================== */

  function updateUserInterface() {

    const registerBtn = document.getElementById("registerBtn");
    const loginBtn = document.getElementById("loginBtn");
    const ordersBtn = document.getElementById("ordersBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userBox = document.getElementById("userBox");
    const userName = document.getElementById("userName");

    if (currentUser) {

      registerBtn.style.display = "none";
      loginBtn.style.display = "none";

      ordersBtn.style.display = "inline-block";
      logoutBtn.style.display = "inline-block";
      userBox.style.display = "inline-block";

      userName.textContent =
        currentUser.displayName ||
        currentUser.email ||
        "Customer";

    } else {

      registerBtn.style.display = "inline-block";
      loginBtn.style.display = "inline-block";

      ordersBtn.style.display = "none";
      logoutBtn.style.display = "none";
      userBox.style.display = "none";

    }

  }


  /* =========================
     LOGOUT
  ========================== */

  window.logoutUser = async function () {

    try {

      await signOut(auth);

      localStorage.removeItem("sbkartCart");

      window.location.href = "index.html";

    } catch (error) {

      alert("Logout failed: " + error.message);

    }

  };


  /* =========================
     ORDER HISTORY
  ========================== */

  window.openOrders = function () {

    if (!auth.currentUser) {

      alert("Pehle Login karein.");

      window.location.href = "register.html";

      return;
    }

    window.location.href = "my-orders.html";

  };


  /* =========================
     CART
  ========================== */

  window.openCart = function () {

    if (!auth.currentUser) {

      alert("Cart use karne ke liye pehle Create Account aur Login karein.");

      window.location.href = "register.html";

      return;

    }

    window.location.href = "cart.html";

  };


  /* =========================
     ADD TO CART
  ========================== */

  window.addToCart = function (index) {

    const user = auth.currentUser;

    if (!user) {

      alert("Pehle Create Account karke Login karein.");

      window.location.href = "register.html";

      return;

    }

    const product = allProducts[index];

    const sizeElement =
      document.getElementById("size-" + index);

    let selectedSize = "";

    if (product.sizes && product.sizes.length > 0) {

      selectedSize = sizeElement.value;

      if (!selectedSize) {

        alert("Please select a size.");

        return;

      }

    }


    let cart =
      JSON.parse(localStorage.getItem("sbkartCart") || "[]");


    const existingIndex = cart.findIndex(item =>
      item.productId === product.id &&
      item.size === selectedSize
    );


    if (existingIndex !== -1) {

      cart[existingIndex].quantity += 1;

    } else {

      cart.push({

        productId: product.id,
        name: product.name,
        price: Number(product.price),
        image: product.image || "",
        size: selectedSize,
        quantity: 1

      });

    }


    localStorage.setItem(
      "sbkartCart",
      JSON.stringify(cart)
    );


    updateCartCount();

    alert("Product Cart me add ho gaya.");

  };


  /* =========================
     CART COUNT
  ========================== */

  function updateCartCount() {

    const cart =
      JSON.parse(localStorage.getItem("sbkartCart") || "[]");

    let count = 0;

    cart.forEach(item => {

      count += Number(item.quantity || 0);

    });

    document.getElementById("cartCount").textContent = count;

  }


  /* =========================
     CATEGORY
  ========================== */

  window.selectCategory = function (category, button) {

    selectedCategory = category;

    document
      .querySelectorAll(".category")
      .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    displayProducts();

  };


  /* =========================
     LOAD PRODUCTS
  ========================== */

  async function loadProducts() {

    try {

      const snapshot =
        await getDocs(collection(db, "products"));

      allProducts = [];

      snapshot.forEach(doc => {

        allProducts.push({

          id: doc.id,
          ...doc.data()

        });

      });

      displayProducts();

    } catch (error) {

      console.error(error);

      document.getElementById("products").innerHTML = `
        <div class="empty">
          Products load nahi ho pa rahe hain.<br><br>
          ${error.message}
        </div>
      `;

    }

  }


  /* =========================
     DISPLAY PRODUCTS
  ========================== */

  function displayProducts() {

    const container =
      document.getElementById("products");

    let products = allProducts;


    if (selectedCategory !== "All") {

      products = allProducts.filter(product =>
        product.category === selectedCategory
      );

    }


    if (products.length === 0) {

      container.innerHTML = `
        <div class="empty">
          Is category me abhi koi product nahi hai.
        </div>
      `;

      return;

    }


    container.innerHTML = "";


    products.forEach((product, index) => {

      const sizes =
        Array.isArray(product.sizes)
          ? product.sizes
          : [];


      let sizeHTML = "";

      if (sizes.length > 0) {

        sizeHTML = `
          <select id="size-${index}">
            <option value="">Select Size</option>

            ${sizes.map(size => `
              <option value="${size}">
                ${size}
              </option>
            `).join("")}

          </select>
        `;

      }


      const card = document.createElement("div");

      card.className = "product";


      card.innerHTML = `

        <img
          src="${product.image || ''}"
          alt="${product.name || 'Product'}"
          onerror="this.style.display='none'"
        >

        <div class="product-info">

          <h3>${product.name || "Product"}</h3>

          <div class="price">
            ₹${Number(product.price || 0)}
          </div>

          <div class="description">
            ${product.description || ""}
          </div>

          ${sizeHTML}

          <button
            class="add"
            onclick="addToCart(${index})">
            Add to Cart
          </button>

        </div>
      `;


      container.appendChild(card);

    });

  }


  /* =========================
     START
  ========================== */

  updateCartCount();

  loadProducts();

</script>

</body>
</html>
