<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>SBKART - Online Shopping</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 15px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .header-buttons a,
    .cart-button {
      background: white;
      color: #111827;
      padding: 9px 12px;
      border-radius: 7px;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      border: none;
    }

    .hero {
      text-align: center;
      padding: 35px 15px;
      background: white;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .hero p {
      margin: 0;
      color: #6b7280;
    }

    .products {
      max-width: 1100px;
      margin: auto;
      padding: 20px 15px;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product {
      background: white;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product-img {
      width: 100%;
      height: 150px;
      overflow: hidden;
      border-radius: 8px;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product h3 {
      margin: 10px 0 5px;
      font-size: 17px;
    }

    .price {
      color: #16a34a;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .add-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 7px;
      background: #16a34a;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .add-btn:active {
      transform: scale(0.98);
    }

    .message {
      text-align: center;
      margin: 20px 0;
      color: #6b7280;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {

      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-buttons {
        justify-content: flex-start;
      }

      .product-grid {
        grid-template-columns: 1fr 1fr;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="header-inner">

    <div class="logo">
      🛍️ SBKART
    </div>


    <div class="header-buttons">

      <!-- Create Account -->

      <a href="register.html">
        Create Account
      </a>


      <!-- Login -->

      <a href="login.html">
        Login
      </a>


      <!-- Cart -->

      <button
        type="button"
        class="cart-button"
        onclick="openCart()"
      >

        🛒 Cart
        (<span id="cartCount">0</span>)

      </button>

    </div>

  </div>

</header>



<section class="hero">

  <h1>
    Welcome to SBKART
  </h1>

  <p>
    Shop your favourite products online
  </p>

</section>



<section class="products">

  <h2>
    Popular Products
  </h2>


  <div
    id="loading"
    class="message"
  >
    Loading products...
  </div>


  <div
    class="product-grid"
    id="productGrid"
  ></div>


  <div
    id="error"
    class="message"
    style="display:none;color:#dc2626;"
  >
    Products load nahi ho pa rahe hain.
  </div>

</section>



<footer>

  © 2026 SBKART

</footer>



<script type="module">

  import {
    initializeApp
  }
  from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


  import {
    getFirestore,
    collection,
    getDocs
  }
  from
  "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



  const firebaseConfig = {

    apiKey:
      "AIzaSyDUjtrUOtcMYtgPFjzfLwMk_c37DytwRA",

    authDomain:
      "sbkart-fa406.firebaseapp.com",

    projectId:
      "sbkart-fa406",

    storageBucket:
      "sbkart-fa406.firebasestorage.app",

    messagingSenderId:
      "890129821807",

    appId:
      "1:890129821807:web:3e1478e1f8b914ff29dd9a"

  };



  const app =
    initializeApp(firebaseConfig);


  const db =
    getFirestore(app);



  // =========================
  // CART
  // =========================


  let cart =
    JSON.parse(
      localStorage.getItem("sbkartCart")
    ) || [];



  function updateCartCount() {

    const count =
      document.getElementById("cartCount");


    let total = 0;


    cart.forEach(function(item) {

      total +=
        Number(item.quantity || 1);

    });


    count.textContent = total;

  }



  // =========================
  // ADD TO CART
  // =========================


  function addToCart(
    id,
    name,
    price,
    image
  ) {


    const existing =
      cart.find(function(item) {

        return item.id === id;

      });



    if (existing) {

      existing.quantity =
        Number(existing.quantity || 1) + 1;

    }

    else {

      cart.push({

        id: id,

        name: name,

        price: Number(price),

        image: image,

        quantity: 1

      });

    }



    localStorage.setItem(
      "sbkartCart",
      JSON.stringify(cart)
    );



    updateCartCount();



    /*
      IMPORTANT:

      Add to Cart ke baad
      koi page redirect nahi hoga.

      Customer same Index page par rahega.
    */

  }



  window.addToCart =
    addToCart;



  // =========================
  // OPEN CART
  // =========================


  function openCart() {

    window.location.href =
      "cart.html";

  }



  window.openCart =
    openCart;



  // =========================
  // LOAD PRODUCTS
  // =========================


  async function loadProducts() {


    const productGrid =
      document.getElementById(
        "productGrid"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    const error =
      document.getElementById(
        "error"
      );


    try {


      const snapshot =
        await getDocs(
          collection(
            db,
            "products"
          )
        );


      loading.style.display =
        "none";


      productGrid.innerHTML =
        "";


      snapshot.forEach(
        function(doc) {


          const product =
            doc.data();


          const name =
            product.name || "Product";


          const price =
            Number(
              product.price || 0
            );


          const image =
            product.image || "";



          const card =
            document.createElement(
              "div"
            );


          card.className =
            "product";



          const imageBox =
            document.createElement(
              "div"
            );


          imageBox.className =
            "product-img";



          const img =
            document.createElement(
              "img"
            );


          img.src =
            image;


          img.alt =
            name;



          imageBox.appendChild(
            img
          );



          const title =
            document.createElement(
              "h3"
            );


          title.textContent =
            name;



          const priceBox =
            document.createElement(
              "div"
            );


          priceBox.className =
            "price";


          priceBox.textContent =
            "₹" + price;



          const button =
            document.createElement(
              "button"
            );


          button.className =
            "add-btn";


          button.type =
            "button";


          button.textContent =
            "🛒 Add to Cart";



          button.onclick =
            function() {

              addToCart(
                doc.id,
                name,
                price,
                image
              );

            };



          card.appendChild(
            imageBox
          );


          card.appendChild(
            title
          );


          card.appendChild(
            priceBox
          );


          card.appendChild(
            button
          );



          productGrid.appendChild(
            card
          );

        }
      );


      updateCartCount();


    }

    catch (err) {


      console.error(
        "Product error:",
        err
      );


      loading.style.display =
        "none";


      error.style.display =
        "block";

    }

  }



  loadProducts();

</script>


</body>

</html>
