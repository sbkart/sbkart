<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SBKART - Online Shopping</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .header-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-buttons a,
    .cart-button {
      background: white;
      color: #111;
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-button {
      background: #ffcc00;
    }

    .hero {
      background: linear-gradient(135deg, #111, #444);
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .hero p {
      margin: 0;
      font-size: 17px;
    }

    .categories {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .categories h2 {
      margin-bottom: 12px;
    }

    .category-buttons {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .category-button {
      white-space: nowrap;
      border: none;
      background: white;
      padding: 11px 15px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-weight: bold;
    }

    .category-button.active {
      background: #111;
      color: white;
    }

    .products {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px 40px;
    }

    .products h2 {
      margin-bottom: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .product-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      padding-bottom: 15px;
    }

    .product-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 14px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .product-category {
      font-size: 13px;
      color: #666;
      margin-bottom: 7px;
    }

    .product-description {
      font-size: 14px;
      color: #555;
      min-height: 38px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .size-label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .size-select {
      width: 100%;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 10px;
      background: white;
    }

    .add-button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .add-button:hover {
      background: #333;
    }

    .message {
      text-align: center;
      padding: 30px;
      color: #555;
    }

    .error {
      color: red;
      text-align: center;
      padding: 20px;
      display: none;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-buttons {
        width: 100%;
      }

      .header-buttons a,
      .cart-button {
        flex: 1;
        text-align: center;
      }

      .hero h1 {
        font-size: 28px;
      }

      .product-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product-image {
        height: 170px;
      }

      .product-info {
        padding: 10px;
      }

      .product-name {
        font-size: 16px;
      }

      .price {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      🛍️ SBKART
    </div>

    <div class="header-buttons">

      <a href="register.html">
        Create Account
      </a>

      <a href="login.html">
        Login
      </a>

      <button
        class="cart-button"
        onclick="openCart()">
        🛒 Cart (<span id="cartCount">0</span>)
      </button>

    </div>
  </div>
</header>


<section class="hero">

  <h1>Welcome to SBKART</h1>

  <p>
    Shop Fashion, Electronics & More
  </p>

</section>


<section class="categories">

  <h2>Categories</h2>

  <div class="category-buttons">

    <button
      class="category-button active"
      onclick="filterCategory('All', this)">
      All
    </button>

    <button
      class="category-button"
      onclick="filterCategory(&quot;Men's Clothing&quot;, this)">
      👨 Men's Clothing
    </button>

    <button
      class="category-button"
      onclick="filterCategory(&quot;Women's Clothing&quot;, this)">
      👩 Women's Clothing
    </button>

    <button
      class="category-button"
      onclick="filterCategory(&quot;Kids' Clothing&quot;, this)">
      🧒 Kids' Clothing
    </button>

    <button
      class="category-button"
      onclick="filterCategory('Footwear', this)">
      👟 Footwear
    </button>

    <button
      class="category-button"
      onclick="filterCategory('Electronics', this)">
      📱 Electronics
    </button>

    <button
      class="category-button"
      onclick="filterCategory('Home & Kitchen', this)">
      🏠 Home & Kitchen
    </button>

  </div>

</section>


<section class="products">

  <h2>Popular Products</h2>

  <div id="loading" class="message">
    Loading products...
  </div>

  <div
    class="product-grid"
    id="productGrid">
  </div>

  <div
    id="error"
    class="error">
    Products load nahi ho pa rahe hain.
  </div>

</section>


<footer>
  © 2026 SBKART. All Rights Reserved.
</footer>


<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


  const firebaseConfig = {
  apiKey: "AIzaSyDUjtrUO2tcMYtgPFjzfLwMk_c37DytwRA",
  authDomain: "sbkart-fa406.firebaseapp.com",
  projectId: "sbkart-fa406",
  storageBucket: "sbkart-fa406.firebasestorage.app",
  messagingSenderId: "890129821807",
  appId: "1:890129821807:web:3e1478e1f8b914ff29dd9a"
};


  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);

  const auth =
    getAuth(app);


  let currentUser = null;

  let cart =
    JSON.parse(localStorage.getItem("sbkartCart")) || [];

  let allProducts = [];


  onAuthStateChanged(auth, (user) => {

    currentUser = user;

    updateCartCount();

  });


  function updateCartCount() {

    const count =
      document.getElementById("cartCount");

    let total = 0;

    cart.forEach(item => {

      total += Number(item.quantity || 1);

    });

    count.textContent = total;

  }


  function addToCart(
    id,
    name,
    price,
    image,
    category,
    size
  ) {

    /*
      Login check
    */

    if (!currentUser) {

      alert(
        "Pehle Create Account karke Login karein."
      );

      window.location.href =
        "register.html";

      return;

    }


    const existing = cart.find(item =>
      item.id === id &&
      item.size === size
    );


    if (existing) {

      existing.quantity =
        Number(existing.quantity || 1) + 1;

    } else {

      cart.push({

        id: id,

        name: name,

        price: Number(price),

        image: image,

        category: category,

        size: size || "",

        quantity: 1

      });

    }


    localStorage.setItem(
      "sbkartCart",
      JSON.stringify(cart)
    );


    updateCartCount();


    alert(
      "Product Cart mein add ho gaya 🛒"
    );

  }


  window.addToCart = addToCart;


  function openCart() {

    /*
      Cart ke liye bhi Login check
    */

    if (!currentUser) {

      alert(
        "Cart use karne ke liye pehle Create Account aur Login karein."
      );

      window.location.href =
        "register.html";

      return;

    }


    window.location.href =
      "cart.html";

  }


  window.openCart = openCart;


  function filterCategory(
    category,
    clickedButton
  ) {

    document
      .querySelectorAll(".category-button")
      .forEach(button => {

        button.classList.remove("active");

      });


    clickedButton.classList.add("active");


    displayProducts(category);

  }


  window.filterCategory =
    filterCategory;


  function displayProducts(
    category = "All"
  ) {

    const productGrid =
      document.getElementById(
        "productGrid"
      );


    productGrid.innerHTML = "";


    let productsToShow;


    if (category === "All") {

      productsToShow =
        allProducts;

    } else {

      productsToShow =
        allProducts.filter(product => {

          return String(
            product.category || ""
          ).toLowerCase()
          === category.toLowerCase();

        });

    }


    if (productsToShow.length === 0) {

      productGrid.innerHTML =
        `<div class="message">
          Is category mein abhi koi product nahi hai.
        </div>`;

      return;

    }


    productsToShow.forEach(product => {

      const card =
        document.createElement("div");

      card.className =
        "product-card";


      const image =
        document.createElement("img");

      image.className =
        "product-image";

      image.src =
        product.image || "";

      image.alt =
        product.name || "Product";


      const info =
        document.createElement("div");

      info.className =
        "product-info";


      const name =
        document.createElement("div");

      name.className =
        "product-name";

      name.textContent =
        product.name || "Product";


      const categoryText =
        document.createElement("div");

      categoryText.className =
        "product-category";

      categoryText.textContent =
        product.category || "General";


      const description =
        document.createElement("div");

      description.className =
        "product-description";

      description.textContent =
        product.description || "";


      const price =
        document.createElement("div");

      price.className =
        "price";

      price.textContent =
        "₹" + Number(
          product.price || 0
        );


      info.appendChild(name);

      info.appendChild(categoryText);

      info.appendChild(description);

      info.appendChild(price);


      const clothingCategories = [
        "Men's Clothing",
        "Women's Clothing",
        "Kids' Clothing",
        "Fashion"
      ];


      const isClothing =
        clothingCategories
          .map(x => x.toLowerCase())
          .includes(
            String(product.category || "")
              .toLowerCase()
          );


      let sizeSelect = null;


      if (isClothing) {

        const sizeLabel =
          document.createElement("label");

        sizeLabel.className =
          "size-label";

        sizeLabel.textContent =
          "Select Size:";


        sizeSelect =
          document.createElement("select");

        sizeSelect.className =
          "size-select";


        const sizes =
          Array.isArray(product.sizes)
            ? product.sizes
            : [
                "S",
                "M",
                "L",
                "XL",
                "XXL"
              ];


        sizes.forEach(size => {

          const option =
            document.createElement("option");

          option.value = size;

          option.textContent = size;

          sizeSelect.appendChild(option);

        });


        info.appendChild(sizeLabel);

        info.appendChild(sizeSelect);

      }


      const button =
        document.createElement("button");

      button.className =
        "add-button";

      button.textContent =
        "🛒 Add to Cart";


      button.onclick = () => {

        const selectedSize =
          sizeSelect
            ? sizeSelect.value
            : "";


        addToCart(

          product.id,

          product.name,

          product.price,

          product.image,

          product.category,

          selectedSize

        );

      };


      info.appendChild(button);

      card.appendChild(image);

      card.appendChild(info);

      productGrid.appendChild(card);

    });

  }


  async function loadProducts() {

    const loading =
      document.getElementById(
        "loading"
      );

    const error =
      document.getElementById(
        "error"
      );


    try {

      const snapshot =
        await getDocs(
          collection(db, "products")
        );


      allProducts = [];


      snapshot.forEach(doc => {

        const product =
          doc.data();


        allProducts.push({

          id: doc.id,

          ...product

        });

      });


      loading.style.display =
        "none";


      displayProducts("All");

      updateCartCount();


    } catch (err) {

      console.error(err);

      loading.style.display =
        "none";

      error.style.display =
        "block";

    }

  }


  loadProducts();

</script>

</body>
</html>
