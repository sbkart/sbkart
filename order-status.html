<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Order Status - SBKART</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-weight: bold;
    }

    .pending {
      color: #d97706;
      font-weight: bold;
    }

    .success {
      color: #15803d;
      font-weight: bold;
    }

    .failed {
      color: #dc2626;
      font-weight: bold;
    }

    .items {
      margin-top: 10px;
    }

    .item {
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    .refresh {
      background: #222;
      color: white;
    }

    .home {
      background: #0a8f3c;
      color: white;
    }

    .message {
      text-align: center;
      padding: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SBKART Order Status</h1>

  <div id="loading" class="box message">
    Loading Order...
  </div>

  <div id="orderBox" style="display:none;">

    <div class="box">

      <h2>Order Details</h2>

      <div class="row">
        <span class="label">Order ID</span>
        <span id="orderId"></span>
      </div>

      <div class="row">
        <span class="label">Customer Name</span>
        <span id="customerName"></span>
      </div>

      <div class="row">
        <span class="label">Mobile</span>
        <span id="mobile"></span>
      </div>

      <div class="row">
        <span class="label">UTR</span>
        <span id="utr"></span>
      </div>

      <div class="row">
        <span class="label">Final Total</span>
        <span id="finalTotal"></span>
      </div>

      <div class="row">
        <span class="label">Payment Status</span>
        <span id="paymentStatus"></span>
      </div>

      <div class="row">
        <span class="label">Order Status</span>
        <span id="orderStatus"></span>
      </div>

    </div>


    <div class="box">

      <h2>Ordered Products</h2>

      <div id="items" class="items"></div>

    </div>


    <div class="box">

      <button class="refresh" onclick="loadOrder()">
        Refresh Status
      </button>

      <button class="home" onclick="window.location.href='index.html'">
        Continue Shopping
      </button>

    </div>

  </div>


  <div id="errorBox"
       class="box message"
       style="display:none;">
  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  const firebaseConfig = {
  apiKey: "AIzaSyDUtjrUO2tcMYtgPFjzfLwMk_c37DytwRA",
  authDomain: "sbkart-fa406.firebaseapp.com",
  projectId: "sbkart-fa406",
  storageBucket: "sbkart-fa406.firebasestorage.app",
  messagingSenderId: "890129821807",
  appId: "1:890129821807:web:3e1478e1f8b914ff29dd9a"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);


let currentUser = null;


const params =
  new URLSearchParams(window.location.search);

const requestedOrderId =
  params.get("order");


onAuthStateChanged(auth, async (user) => {

  if (!user) {

    alert(
      "Order Status dekhne ke liye pehle Login karein."
    );

    window.location.href = "login.html";

    return;
  }

  currentUser = user;

  if (!requestedOrderId) {

    showError("Order ID nahi mili.");

    return;
  }

  await loadOrder();

});


window.loadOrder = async function() {

  if (!currentUser) {
    return;
  }

  document.getElementById("loading").style.display =
    "block";

  document.getElementById("orderBox").style.display =
    "none";

  document.getElementById("errorBox").style.display =
    "none";


  try {

    const snapshot =
      await getDocs(collection(db, "orders"));


    let foundOrder = null;


    snapshot.forEach((docSnap) => {

      const data = docSnap.data();


      if (
        data.orderId === requestedOrderId &&
        data.customerUid === currentUser.uid
      ) {

        foundOrder = data;

      }

    });


    if (!foundOrder) {

      showError(
        "Order nahi mila ya aapke account se match nahi karta."
      );

      return;
    }


    displayOrder(foundOrder);


  } catch (error) {

    console.error(error);

    showError(
      "Order load nahi ho saka.\n" +
      error.message
    );

  }

};


function displayOrder(order) {

  document.getElementById("loading").style.display =
    "none";

  document.getElementById("orderBox").style.display =
    "block";


  document.getElementById("orderId").textContent =
    order.orderId || "-";


  document.getElementById("customerName").textContent =
    order.customerName || "-";


  document.getElementById("mobile").textContent =
    order.mobile || "-";


  document.getElementById("utr").textContent =
    order.utr || "-";


  document.getElementById("finalTotal").textContent =
    "₹" +
    Number(order.finalTotal || 0).toFixed(2);


  setStatus(
    "paymentStatus",
    order.paymentStatus || "Pending"
  );


  setStatus(
    "orderStatus",
    order.orderStatus || "Pending"
  );


  const itemsBox =
    document.getElementById("items");

  itemsBox.innerHTML = "";


  const items = order.items || [];


  items.forEach((item) => {

    const quantity =
      Number(item.quantity || 1);

    const price =
      Number(item.price || 0);

    const total =
      price * quantity;


    const div =
      document.createElement("div");

    div.className = "item";


    div.innerHTML = `

      <b>${escapeHtml(item.name)}</b>

      <br>

      Quantity: ${quantity}

      ${
        item.size
        ? `<br>Size: ${escapeHtml(item.size)}`
        : ""
      }

      <br>

      Price: ₹${total.toFixed(2)}

    `;


    itemsBox.appendChild(div);

  });

}


function setStatus(elementId, status) {

  const element =
    document.getElementById(elementId);

  element.textContent = status;


  element.className = "";


  if (
    status === "Successful" ||
    status === "Approved"
  ) {

    element.classList.add("success");

  }

  else if (
    status === "Failed" ||
    status === "Rejected"
  ) {

    element.classList.add("failed");

  }

  else {

    element.classList.add("pending");

  }

}


function showError(message) {

  document.getElementById("loading").style.display =
    "none";

  document.getElementById("orderBox").style.display =
    "none";

  const errorBox =
    document.getElementById("errorBox");

  errorBox.style.display =
    "block";

  errorBox.textContent =
    message;

}


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
  </html>
